# Core VM
#   build-for-testing
#   test-without-building

# Data VM
#   build-for-testing
#   test-without-building

# App VM
#   build-for-testing
#   test-without-building

# build-and-test.yml
name: 하루한컷 Build & Test

on:
  workflow_dispatch:
    inputs:
      triggered_by_command:
        description: "Triggered by PR command"
        required: false
        default: "false"
      pr_number:
        description: "PR number"
        required: false

  schedule:
    # UTC 22:00 = KST 07:00
    - cron: "0 22 * * *"

  # PR 댓글 명령어로도 트리거 가능
  # issue_comment:
  #   types: [created]

  # PR이 열릴 때마다 실행 (main 브랜치 대상)
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

# 같은 PR/브랜치에 새 커밋이 올라오면 이전 CI를 취소하고 최신 실행만 검사한다.
# PR 댓글 명령어로 실행한 경우에는 입력된 PR 번호를 같은 그룹 키로 사용한다.
concurrency:
  group: haruhancut-build-and-test-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.3"
  SIMULATOR_NAME: "iPhone 16"
  SIMULATOR_OS: "26.2"

# Matrix Build + Test (병렬, VM 독립)
jobs:
  test:
    name: Test / ${{ matrix.module }}
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        module: [Core, Data, App]

    steps:
      - uses: actions/checkout@v4

      - name: Create Shared.xcconfig
        run: |
          mkdir -p Projects/Shared/Configs
          cat << 'EOF' > Projects/Shared/Configs/Shared.xcconfig
          ${{ secrets.SHARED_XCCONFIG }}
          EOF

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      # Exact-key-only caches prevent artifacts from a different dependency graph
      # from being restored after Tuist/Package.resolved changes.
      # SwiftPM Cache
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-v2-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved') }}

      # Tuist Cache
      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/.tuist/Dependencies
            ~/.tuist/Cache
            Tuist/Dependencies/.build
          key: tuist-v2-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved') }}

      # DerivedData Cache
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-v2-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ matrix.module }}-${{ hashFiles('Tuist.swift', 'Workspace.swift', 'Tuist/Package.swift', 'Tuist/Package.resolved', 'Projects/**/Project.swift') }}

      - name: Set up Mise and Tuist
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Generate Project
        run: |
          tuist install
          tuist generate --no-open

      # Simulator UUID Resolve
      - name: Resolve Simulator UUID
        run: scripts/resolve_simulator_udid.sh

      # 1. Build For Testing (VM 내부)
      - name: Build For Testing
        run: |
          xcodebuild build-for-testing \
            -workspace Haruhancut.xcworkspace \
            -scheme ${{ matrix.module }} \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData

      # 2. Test Without Building (같은 DerivedData 사용)
      - name: Test Without Building
        run: |
          xcodebuild test-without-building \
            -workspace Haruhancut.xcworkspace \
            -scheme ${{ matrix.module }} \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData

  # Notify
  notify:
    name: Notify Result
    runs-on: macos-15
    needs: test
    if: always()

    steps:
      - name: Comment success (PR only)
        if: needs.test.result == 'success' && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ 하루한컷 패키지를 성공적으로 빌드하고 테스트했습니다.

      - name: Comment failure (PR only)
        if: needs.test.result != 'success' && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ❌ **하루한컷 iOS CI 실패**
            - 일부 모듈 테스트 실패

      # 메일은 모든 이벤트에서
      - name: Send email on success
        if: needs.test.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ✅ 하루한컷 iOS CI 성공
          body: |
            CI 성공 🎉

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: indextrown@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>

      - name: Send email on failure
        if: needs.test.result != 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ❌ 하루한컷 iOS CI 실패
          body: |
            CI 실패 발생 ❌

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
            URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: indextrown@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>

name: iOS External Dependency Updater

on:
  schedule:
    # Monday 00:00 UTC = Monday 09:00 KST
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check candidates and publish a report without changing files or creating a PR."
        required: false
        default: false
        type: boolean

# contents is required for the updater branch and pull-requests/issues are
# required for the PR and its dependencies label.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ios-external-dependency-updater
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.3"
  SIMULATOR_NAME: "iPhone 16"
  SIMULATOR_OS: "26.2"

jobs:
  update:
    name: Check and validate iOS dependencies
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test dependency updater policy
        run: python3 -m unittest scripts/tests/test_update_ios_dependencies.py

      - name: Find safe dependency updates
        id: update
        shell: bash
        run: |
          set -euo pipefail

          arguments=(
            --report "$RUNNER_TEMP/dependency-update.json"
            --markdown-report "$RUNNER_TEMP/dependency-update.md"
          )
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            arguments+=(--dry-run)
          fi

          python3 scripts/update_ios_dependencies.py "${arguments[@]}"
          has_changes="$(python3 -c 'import json, sys; print(str(json.load(open(sys.argv[1]))["has_changes"]).lower())' "$RUNNER_TEMP/dependency-update.json")"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/dependency-update.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Shared.xcconfig
        if: steps.update.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          mkdir -p Projects/Shared/Configs
          cat << 'EOF' > Projects/Shared/Configs/Shared.xcconfig
          ${{ secrets.SHARED_XCCONFIG }}
          EOF

      - name: Select Xcode
        if: steps.update.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Set up Mise and Tuist
        if: steps.update.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve dependencies and generate project
        if: steps.update.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          set -euo pipefail
          tuist install
          tuist generate --no-open
          git diff --exit-code --check
          if git diff --quiet -- Tuist/Package.swift Tuist/Package.resolved; then
            echo "::error::The updater selected a version but Tuist did not change a tracked dependency file."
            exit 1
          fi

      - name: Resolve Simulator UUID
        if: steps.update.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | \
            grep "iOS ${SIMULATOR_OS}" -A 20 | \
            grep "^ *${SIMULATOR_NAME} (" | head -n 1 | sed -E 's/.*\\(([A-F0-9-]+)\\).*/\\1/')
          if [[ -z "$UDID" ]]; then
            echo "::error::${SIMULATOR_NAME} (iOS ${SIMULATOR_OS}) simulator not found."
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test Core, Data, and App
        if: steps.update.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        shell: bash
        run: |
          set -euo pipefail
          for module in Core Data App; do
            xcodebuild build-for-testing \
              -workspace Haruhancut.xcworkspace \
              -scheme "$module" \
              -configuration Debug \
              -destination "id=$SIM_UDID" \
              -derivedDataPath DerivedData

            xcodebuild test-without-building \
              -workspace Haruhancut.xcworkspace \
              -scheme "$module" \
              -configuration Debug \
              -destination "id=$SIM_UDID" \
              -derivedDataPath DerivedData
          done

      - name: Create or update dependency PR
        if: steps.update.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/ios-dependency-updater
          base: main
          delete-branch: true
          commit-message: "chore: update iOS external dependencies"
          title: "chore(deps): update external dependencies"
          body-path: ${{ runner.temp }}/dependency-update.md
          labels: dependencies
          add-paths: |
            Tuist/Package.swift
            Tuist/Package.resolved
